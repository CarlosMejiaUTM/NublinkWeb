<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nublink | Registra tu tienda</title>

    <link rel="icon" href="/icons/icon-192x192.png" />
    <meta name="theme-color" content="#4B43B3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // --- ¡CONFIGURACIÓN ACTUALIZADA! ---
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'primary': '#4B43B3',
              'primary-dark': '#3A318A',
              'primary-light': '#E0E7FF',
              'secondary': '#F4F6F8',
              'secondary-light': '#EAEFFB',
              'text-main': '#1A1A1A',
              'text-muted': '#6B7281',
              'bg-base': '#F4F6F8',
              'line-light': '#E5E7EB',
              'surface': '#FFFFFF',
            },
            fontFamily: {
              sans: ['Public Sans', 'sans-serif'],
            },
            // --- ¡NUEVO! Animaciones para el "Wow" ---
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            },
            animation: {
              fadeInUp: 'fadeInUp 0.8s ease-out forwards',
              fadeIn: 'fadeIn 0.5s ease-out forwards',
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
